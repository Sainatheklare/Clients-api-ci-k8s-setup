apiVersion: v1
kind: ConfigMap
metadata:
name: clients-api-config
namespace: clients-api
data:
MONGO_DB: clientsdb
MONGO_HOST: mongodb.clients-api.svc.cluster.local
MONGO_PORT: "27017"
   secret-example.yaml (also includes mongo-creds)
   apiVersion: v1
kind: Secret
metadata:
name: clients-api-secrets
namespace: clients-api
type: Opaque
stringData:
# App secrets (example)
JWT_SECRET: "REPLACE_ME_WITH_STRONG_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
name: mongo-creds
namespace: clients-api
type: Opaque
stringData:
mongo-root-username: root
mongo-root-password: changeMe123!
