apiVersion: v1
kind: Service
metadata:
name: mongodb
namespace: clients-api
labels:
app: mongodb
spec:
ports:
- port: 27017
name: mongodb
clusterIP: None
selector:
app: mongodb
        k8s/mongodb/statefulset.yaml
        apiVersion: apps/v1
kind: StatefulSet
metadata:
name: mongodb
namespace: clients-api
spec:
serviceName: "mongodb"
replicas: 1
selector:
matchLabels:
app: mongodb
template:
metadata:
labels:
app: mongodb
spec:
containers:
- name: mongo
image: mongo:6.0
ports:
- containerPort: 27017
name: mongodb
volumeMounts:
- name: mongo-data
mountPath: /data/db
env:
- name: MONGO_INITDB_ROOT_USERNAME
valueFrom:
secretKeyRef:
name: mongo-creds
key: mongo-root-username
- name: MONGO_INITDB_ROOT_PASSWORD
valueFrom:
secretKeyRef:
name: mongo-creds
key: mongo-root-password
volumeClaimTemplates:
- metadata:
name: mongo-data
spec:
accessModes: [ "ReadWriteOnce" ]
resources:
requests:
storage: 10Gi
